<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 引入 LINE LIFF SDK (便於串接) -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <title>鹿鹿領地拼圖 (Deer Queens)</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #f4f6f0; /* 換成森林感的淡綠背景 */
      color: #2e4a32; /* 深森綠字體 */
      padding: 20px;
    }
    h1 { margin-bottom: 8px; font-size: 1.8rem; }
    .status-bar {
      margin-bottom: 16px;
      font-size: 1.2rem;
      font-weight: bold;
    }
    #player-name {
      margin-bottom: 8px;
      font-size: 0.95rem;
      color: #666;
    }
    #board {
      display: grid;
      grid-template-columns: repeat(6, 56px);
      grid-template-rows: repeat(6, 56px);
      gap: 3px;
      background: #3e5a41; /* 森林深綠框 */
      padding: 6px;
      border-radius: 12px;
      user-select: none;
    }
    .cell {
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      cursor: pointer;
      border-radius: 6px;
      transition: transform 0.1s;
      position: relative;
    }
    .cell:active { transform: scale(0.95); }
    
    /* 鹿鹿圖片樣式 */
    .deer-img {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }

    /* 6 種柔和森林系色塊 */
    .zone-0 { background-color: #ffd8a8; } /* 暖橘 */
    .zone-1 { background-color: #c3fae8; } /* 薄荷綠 */
    .zone-2 { background-color: #d8f5a2; } /* 淺草綠 */
    .zone-3 { background-color: #ffdeeb; } /* 櫻花粉 */
    .zone-4 { background-color: #e5dbff; } /* 薰衣草 */
    .zone-5 { background-color: #e2e6ea; } /* 迷霧灰 */
    
    .msg {
      margin-top: 16px;
      font-size: 1.1rem;
      height: 24px;
      color: #b04b07; /* 醒目橘紅 */
      font-weight: bold;
      text-align: center;
    }
    .btn-container {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }
    .btn {
      padding: 8px 18px;
      background: #4f772d; /* 森林綠 */
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }
    .btn-share {
      background: #118141; /* LINE 綠 */
    }
  </style>
</head>
<body>

  <h1>🦌 鹿鹿領地拼圖</h1>
  <div id="player-name"></div>
  <div class="status-bar" id="counter">已放鹿鹿: 0 / 6</div>
  <div id="board"></div>
  <div class="msg" id="msg"></div>
  
  <div class="btn-container">
    <button class="btn" onclick="resetGame()">重置關卡</button>
    <button class="btn btn-share" onclick="shareVictory()">分享給好友</button>
  </div>

  <script>
    const N = 6;
    // 預設一組 6x6 的色塊關卡
    const colorMap = [
      [0, 0, 1, 1, 1, 2],
      [0, 0, 0, 1, 2, 2],
      [3, 0, 4, 4, 2, 2],
      [3, 3, 4, 4, 5, 2],
      [3, 3, 4, 5, 5, 5],
      [3, 3, 5, 5, 5, 5]
    ];

    // 0: 空白, 1: 叉叉, 2: 鹿鹿
    let boardState = Array.from({ length: N }, () => Array(N).fill(0));

    // 使用剛才為你準備的可愛 8-bit 鹿鹿圖片
    const DEER_IMAGE_URL = "https://raw.githubusercontent.com/YourGitHubUsername/your-repo/main/deer.png"; // ⚠️發布後可替換為你放在 GitHub 上的圖片路徑或使用此 Base64
    const DEER_IMAGE = "image_1.png"; // AI 生成的鹿鹿圖像物件

    const MY_LIFF_ID = "YOUR_LIFF_ID_HERE"; // 填入你的 LINE LIFF ID

    // 初始化 LINE LIFF 
    async function initLiff() {
      try {
        await liff.init({ liffId: MY_LIFF_ID });
        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          document.getElementById("player-name").textContent = `冒險者：${profile.displayName}`;
        } else {
          liff.login();
        }
      } catch (err) {
        console.log("非 LINE 環境或未串接 LIFF ID：", err);
      }
    }

    const boardEl = document.getElementById("board");
    const counterEl = document.getElementById("counter");
    const msgEl = document.getElementById("msg");

    function renderBoard() {
      boardEl.innerHTML = "";
      let deerCount = 0;

      for (let r = 0; r < N; r++) {
        for (let c = 0; c < N; c++) {
          const cell = document.createElement("div");
          cell.className = `cell zone-${colorMap[r][c]}`;
          
          if (boardState[r][c] === 1) {
            cell.textContent = "✕";
            cell.style.color = "#7a8a7c";
          } else if (boardState[r][c] === 2) {
            // 替換為鹿鹿圖像
            const img = document.createElement("img");
            img.src = DEER_IMAGE; 
            img.alt = "鹿";
            img.className = "deer-img";
            cell.appendChild(img);
            deerCount++;
          }

          cell.onclick = () => onCellClick(r, c);
          boardEl.appendChild(cell);
        }
      }

      counterEl.textContent = `已放鹿鹿: ${deerCount} / ${N}`;
      validateGame(deerCount);
    }

    function onCellClick(r, c) {
      boardState[r][c] = (boardState[r][c] + 1) % 3;
      msgEl.textContent = "";
      renderBoard();
    }

    function validateGame(deerCount) {
      if (deerCount !== N) return;

      const deers = [];
      for (let r = 0; r < N; r++) {
        for (let c = 0; c < N; c++) {
          if (boardState[r][c] === 2) deers.push({ r, c, zone: colorMap[r][c] });
        }
      }

      const rows = new Set(), cols = new Set(), zones = new Set();

      for (let i = 0; i < deers.length; i++) {
        const { r, c, zone } = deers[i];

        // 檢查同行/同列/同區域衝突
        if (rows.has(r) || cols.has(c) || zones.has(zone)) {
          msgEl.style.color = "#b04b07";
          msgEl.textContent = "⚠️ 有鹿鹿在同行、同列或同色塊內，鹿角會打架喔！";
          return;
        }
        rows.add(r);
        cols.add(c);
        zones.add(zone);

        // 檢查九宮格鄰近衝突
        for (let j = i + 1; j < deers.length; j++) {
          const other = deers[j];
          if (Math.abs(r - other.r) <= 1 && Math.abs(c - other.c) <= 1) {
            msgEl.style.color = "#b04b07";
            msgEl.textContent = "⚠️ 鹿鹿靠太近啦，鹿角碰在一起了！";
            return;
          }
        }
      }

      msgEl.style.color = "#2b6a3e";
      msgEl.textContent = "🎉 太厲害了！所有的鹿鹿都有了自己的大自然領地！";
    }

    function resetGame() {
      boardState = Array.from({ length: N }, () => Array(N).fill(0));
      msgEl.textContent = "";
      renderBoard();
    }

    function shareVictory() {
      if (!liff.isApiAvailable('shareTargetPicker')) {
        alert("通關成功！快截圖分享給你的好友吧！");
        return;
      }
      liff.shareTargetPicker([
        {
          type: "text",
          text: "我剛剛在《鹿鹿領地拼圖》成功通關了！每隻鹿都有自己的領地不撞角。你也來試試：https://liff.line.me/" + MY_LIFF_ID
        }
      ]);
    }

    window.onload = () => {
      initLiff();
      renderBoard();
    };
  </script>
</body>
</html>
